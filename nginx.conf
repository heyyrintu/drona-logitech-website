# Serves the Next.js static export (output: 'export', trailingSlash: true).
#
# Because next.config.mjs sets trailingSlash, every page is exported as
# <route>/index.html. `try_files $uri $uri/` lets nginx serve those and issue
# its own 301 from /about to /about/, matching Next's canonical URLs.

# ── This block must stay the default server. ──
#
# `server_name _;` is NOT a wildcard. `_` is simply a name that can never match
# a real Host header. A block catches unmatched requests only by being the
# *default server* for its listen address, and nginx assigns that role to the
# first block declared for the address unless one is explicitly marked
# `default_server`.
#
# `default_server` ensures the container healthcheck and any hostname assigned
# by Coolify reach the static site. Canonical-host redirects should be added at
# the proxy layer only after the final public domain is verified.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff font/woff2;

    # Hashed build assets never change under a given name — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Images and fonts: long but not immutable, since filenames are stable.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Crawler-facing files. `trailingSlash` does not apply to these — Next
    # exports each as a flat file — but nginx would otherwise serve llms.txt and
    # rss.xml with the wrong Content-Type, so set it explicitly. Feed readers
    # and some crawlers reject an RSS document served as text/plain.
    location = /robots.txt   { default_type text/plain; charset utf-8; }
    location = /sitemap.xml  { default_type application/xml; charset utf-8; }
    location = /llms.txt     { default_type text/plain; charset utf-8; }
    location = /blog/rss.xml { default_type application/rss+xml; charset utf-8; }

    # Pages. Headers are set here rather than at server level because an
    # add_header in any location replaces inherited ones outright.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control            "no-cache" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
